<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小程序首页板块编辑器</title>
<style>
:root{--canvas-width:338px;--panel-bg:rgba(249,248,243,.96);--line:#d9d4ca;--accent:#7a736a;--accent-soft:rgba(122,115,106,.12);--bg-top:#395f52;--bg-mid:#25463a;--bg-bottom:#132820}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f1f1f;background:radial-gradient(circle at top,var(--bg-top) 0,var(--bg-mid) 35%,var(--bg-bottom) 100%)}
button,select,input,textarea{font:inherit;width:100%;border:1.5px solid #222;background:#fff;border-radius:14px}button{min-height:42px;cursor:pointer;padding:10px 12px}input,select,textarea{padding:10px 12px}textarea{min-height:96px;resize:vertical}
.app{min-height:100vh;display:grid;grid-template-columns:360px 240px 1fr;gap:24px;padding:24px}
.side,.aux-card{background:var(--panel-bg);border-radius:24px;padding:20px;box-shadow:0 20px 48px rgba(0,0,0,.18)}.side{position:sticky;top:20px;height:fit-content}.aux{position:sticky;top:20px;height:fit-content}
h1{margin:0 0 10px;font-size:28px;line-height:1.05}.desc{margin:0 0 16px;color:#4c4c4c;line-height:1.6}.sec{margin-top:18px;display:grid;gap:10px}.st{font-size:12px;color:#757575;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.g2,.g3{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.box{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;line-height:1.6}.box strong{display:block;margin-bottom:8px}.f{display:grid;gap:6px}.f label{font-size:12px;color:#757575}.rr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.rnum{display:grid;grid-template-columns:1fr 58px auto;gap:8px;align-items:center}.rnum input[type=number]{padding:8px 8px;border-radius:10px;text-align:center}.unit{font-size:12px;color:#6b6b6b}.hint{font-size:12px;color:#6b6b6b}.a{background:#ece9e3;border-color:var(--accent);color:#4b463f}
.phone-wrap{display:flex;justify-content:center;position:relative;overflow:visible}.phone{width:356px;padding:0;border-radius:24px;background:transparent;position:relative;left:0;top:0}.screen{display:flex;flex-direction:column;aspect-ratio:1 / 2;border-radius:22px;overflow:hidden;background:#fff;border:1px solid #e5dfd6;box-shadow:0 14px 30px rgba(0,0,0,.09)}
.status{height:28px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 5px;font-size:12px;font-weight:600;color:#111;background:#fff;cursor:grab;user-select:none;touch-action:none}.status.grabbing{cursor:grabbing}.status-time{letter-spacing:.01em}.status-icons{display:flex;align-items:center;gap:6px}
.icon-signal{display:flex;align-items:flex-end;gap:1.5px;height:10px}.icon-signal span{width:2.5px;background:#111;border-radius:2px}.icon-signal span:nth-child(1){height:3px;opacity:.62}.icon-signal span:nth-child(2){height:5px;opacity:.75}.icon-signal span:nth-child(3){height:7px;opacity:.88}.icon-signal span:nth-child(4){height:9px}
.icon-wifi{position:relative;width:12px;height:8px}.icon-wifi::before,.icon-wifi::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:1.6px solid #111;border-color:#111 transparent transparent transparent;border-radius:50%}.icon-wifi::before{top:0;width:12px;height:12px}.icon-wifi::after{top:3px;width:6px;height:6px}
.icon-battery{position:relative;width:18px;height:9px;border:1.5px solid #111;border-radius:3px}.icon-battery::before{content:"";position:absolute;top:2px;right:-3px;width:2px;height:3px;border-radius:0 2px 2px 0;background:#111}.icon-battery::after{content:"";position:absolute;inset:1.5px;width:11px;background:#111;border-radius:1px}
.viewport{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 10px 0;background:#fff;scrollbar-width:none;-ms-overflow-style:none;outline:none}.viewport::-webkit-scrollbar{width:0;height:0}
.canvas{position:relative;width:var(--canvas-width);min-height:0;margin:0 auto;padding-bottom:0}
.dock-slot{position:sticky;bottom:0;z-index:60;display:flex;justify-content:center;margin:0 -10px 0;padding:0 10px 0;background:#fff;pointer-events:none}.dock-slot .module{pointer-events:auto}
.module{position:absolute;left:0;width:var(--canvas-width);background:transparent;touch-action:none}.module.sel{outline:1.5px solid var(--accent);outline-offset:4px;box-shadow:0 0 0 4px var(--accent-soft)}.module.ghost{opacity:.56}
.stage{position:relative;width:100%;height:100%}.editable{position:absolute;user-select:none}.editable.selected{outline:1.5px dashed var(--accent);outline-offset:2px}.editable.editing{cursor:text;user-select:text}.e-text{display:block;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;cursor:move;z-index:20}.e-text.selected{z-index:28}.e-text.editing{z-index:40}.e-block{display:flex;align-items:center;justify-content:center;cursor:move;z-index:2}.e-block.selected{z-index:6}
.surface{border:1.5px solid var(--line);border-radius:18px;background:#fffdfa;box-shadow:0 6px 18px rgba(0,0,0,.03)}.item-card{border:1.5px solid var(--line);border-radius:16px;background:#fffdfa}.pill-block{border:1.5px solid #d8d3c8;border-radius:999px;background:#fbfaf7}.button-block{border-radius:10px;background:#262626}.nav-shell{border-top:1px solid #ece6dc;background:#fff;box-shadow:0 -4px 14px rgba(0,0,0,.03)}.dot-block{border:none;border-radius:4px;background:#ddd8d0}
.tt{font-weight:700;line-height:1.3}.ss{font-weight:400;color:#707070;line-height:1.5}.btn-text{color:#fff;font-size:12px;font-weight:700}.pill-text{font-size:11px;color:#666}.nav-text{font-size:11px;color:#555}
.module-handle,.element-handle{position:absolute;width:10px;height:10px;background:#fff;border:1.5px solid var(--accent);border-radius:3px;z-index:30;pointer-events:auto}.n{top:-5px;left:calc(50% - 5px);cursor:n-resize}.s{bottom:-5px;left:calc(50% - 5px);cursor:s-resize}.e{right:-5px;top:calc(50% - 5px);cursor:e-resize}.w{left:-5px;top:calc(50% - 5px);cursor:w-resize}.ne{top:-5px;right:-5px;cursor:ne-resize}.nw{top:-5px;left:-5px;cursor:nw-resize}.se{bottom:-5px;right:-5px;cursor:se-resize}.sw{bottom:-5px;left:-5px;cursor:sw-resize}
.guide,.placeholder,.overlay-guide{position:absolute;pointer-events:none}.guide.v,.overlay-guide.v{width:1px;background:rgba(122,115,106,.7)}.guide.h,.overlay-guide.h{height:1px;background:rgba(122,115,106,.7)}.placeholder{left:0;width:100%;height:8px;background:rgba(245,158,11,.9);border-radius:999px}
.size-tag{position:absolute;pointer-events:none;border-radius:999px;padding:4px 8px;font-size:11px;background:rgba(245,244,241,.96);color:#514a43;border:1px solid rgba(122,115,106,.28)}
.element-overlay{position:absolute;border:1.5px dashed var(--accent);box-shadow:0 0 0 3px rgba(122,115,106,.12);pointer-events:none;z-index:25}
.shot-mode .module.sel{outline:none!important;box-shadow:none!important}
.shot-mode .editable.selected{outline:none!important}
.shot-mode .element-overlay,.shot-mode .module-handle,.shot-mode .element-handle,.shot-mode .guide,.shot-mode .overlay-guide,.shot-mode .size-tag,.shot-mode .placeholder{display:none!important}
@media (max-width:1080px){.app{grid-template-columns:1fr}.side,.aux{position:static}}
</style>
</head>
<body>
<main class="app">
  <aside class="side">
    <h1>板块编辑器</h1>
    <p class="desc">现在支持元素级编辑。每个文字块和色块都可以单独移动、缩放，并在边线、中线和对齐位置自动吸附。</p>
    <div class="sec"><div class="st">新增板块</div><div class="g2">
      <button data-add="hero">顶部卡</button><button data-add="login">登录卡</button>
      <button data-add="entry">双入口</button><button data-add="quick">快捷区</button>
      <button data-add="promo">活动位</button><button data-add="dish">推荐商品</button>
      <button data-add="nav">底部导航</button><button id="dup">复制选中</button>
    </div></div>
    <div class="sec"><div class="st">全局操作</div><div class="g2">
      <button id="undo">撤销</button><button id="del">删除选中</button><button id="reset">恢复初始</button>
      <button id="shot">截图下载</button>
    </div></div>
    <div class="sec"><div class="st">选中板块配置</div><div class="box" id="ins"><strong>未选中</strong>点击右侧任意板块开始编辑。</div></div>
  </aside>

  <aside class="aux"><div class="aux-card" id="aux"><strong>文字与排版</strong>选中板块后，这里显示文字对齐、标题方向和文本编辑。</div></aside>

  <section class="phone-wrap">
    <div class="phone">
      <div class="screen">
        <div class="status">
          <div class="status-time">9:41</div>
          <div class="status-icons">
            <div class="icon-signal"><span></span><span></span><span></span><span></span></div>
            <div class="icon-wifi"></div>
            <div class="icon-battery"></div>
          </div>
        </div>
        <div class="viewport" tabindex="0">
          <div class="canvas" id="cv"></div>
          <div class="dock-slot" id="dock"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
const cv=document.getElementById('cv'),dock=document.getElementById('dock'),ins=document.getElementById('ins'),aux=document.getElementById('aux'),dup=document.getElementById('dup'),del=document.getElementById('del'),reset=document.getElementById('reset'),shot=document.getElementById('shot'),screenEl=document.querySelector('.screen'),viewportEl=document.querySelector('.viewport'),statusBar=document.querySelector('.status'),phoneEl=document.querySelector('.phone');
const SPEC={hero:{label:'顶部卡',width:338,height:120,rec:'338×96-120',layouts:[]},login:{label:'登录卡',width:338,height:80,rec:'338×72-90',layouts:[]},entry:{label:'双入口',width:338,itemH:116,rec:'338×110-160',layouts:[1,2,3]},quick:{label:'快捷区',width:338,itemH:82,rec:'338×72-100',layouts:[2,3,4]},promo:{label:'活动位',width:338,height:74,rec:'338×72-96',layouts:[]},dish:{label:'推荐商品',width:338,itemH:140,rec:'338×120-160',layouts:[1,2,3]},nav:{label:'底部导航',width:338,itemH:62,rec:'338×60-72',layouts:[3,4,5]}};
let modules=[],selectedId=null,selectedElement=null,focusText=null,drag=null,editingText=null,lastTextTap=null;
let historyStack=[],historyLock=false;
let statusHoldTimer=null,statusDrag=null,phoneOffset={x:0,y:0};
const uid=()=>`m-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,clamp=(n,min,max)=>Math.max(min,Math.min(max,n)),snap=(n,step=2)=>Math.round(n/step)*step,HANDLES=['n','s','e','w','ne','nw','se','sw'],SNAP_THRESHOLD=6;
const hasItems=m=>Array.isArray(m.items),isNav=m=>m.type==='nav',navModule=()=>modules.find(isNav)||null,flowModules=()=>modules.filter(m=>!isNav(m)),current=()=>modules.find(m=>m.id===selectedId)||null;
const getByPath=(obj,path)=>path.split('.').reduce((acc,key)=>acc?.[key],obj);
function setByPath(obj,path,value){const keys=path.split('.');let ref=obj;for(let i=0;i<keys.length-1;i++)ref=ref[keys[i]];ref[keys.at(-1)]=value}
function captureState(){return JSON.stringify({modules,selectedId,selectedElement,focusText})}
function updateUndoButton(){document.getElementById('undo')?.toggleAttribute('disabled',historyStack.length<2)}
function commitHistory(){if(historyLock)return;const shot=captureState();if(historyStack.at(-1)!==shot)historyStack.push(shot);if(historyStack.length>80)historyStack.shift();updateUndoButton()}
function restoreHistory(shot){historyLock=true;const state=JSON.parse(shot);modules=state.modules;selectedId=state.selectedId;selectedElement=state.selectedElement;focusText=state.focusText;drag=null;editingText=null;lastTextTap=null;renderAll();historyLock=false;updateUndoButton()}
function undoHistory(){if(historyStack.length<2)return;historyStack.pop();restoreHistory(historyStack.at(-1))}
function loadHtml2Canvas(){return new Promise((resolve,reject)=>{if(window.html2canvas)return resolve(window.html2canvas);const old=document.getElementById('html2canvas-cdn');if(old){old.addEventListener('load',()=>resolve(window.html2canvas),{once:true});old.addEventListener('error',reject,{once:true});return}const script=document.createElement('script');script.id='html2canvas-cdn';script.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';script.onload=()=>resolve(window.html2canvas);script.onerror=()=>reject(new Error('html2canvas load failed'));document.head.appendChild(script)})}
function downloadDataUrl(dataUrl,name){const a=document.createElement('a');a.href=dataUrl;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function buildExportScreen(){
  const shell=document.createElement('div');
  shell.style.cssText=`position:fixed;left:-99999px;top:0;width:${Math.round(screenEl.getBoundingClientRect().width)}px;background:#fff;border:1px solid #e5dfd6;border-radius:22px;overflow:hidden;z-index:-1`;

  const statusClone=statusBar.cloneNode(true);
  statusClone.classList.remove('grabbing');
  shell.appendChild(statusClone);

  const body=document.createElement('div');
  body.style.cssText='background:#fff;padding:10px 10px 0';

  const canvasClone=cv.cloneNode(true);
  const contentH=Math.max(cv.scrollHeight,cv.getBoundingClientRect().height);
  canvasClone.style.minHeight=`${Math.ceil(contentH)}px`;
  canvasClone.style.height=`${Math.ceil(contentH)}px`;
  canvasClone.style.paddingBottom='0';
  canvasClone.querySelectorAll('.selected,.element-overlay,.module-handle,.element-handle,.guide,.overlay-guide,.size-tag,.placeholder').forEach(node=>{
    node.classList.remove('selected');
    if(node.classList.contains('element-overlay')||node.classList.contains('module-handle')||node.classList.contains('element-handle')||node.classList.contains('guide')||node.classList.contains('overlay-guide')||node.classList.contains('size-tag')||node.classList.contains('placeholder'))node.remove()
  });
  body.appendChild(canvasClone);

  const navSrc=dock.querySelector('.module');
  if(navSrc){
    const navWrap=document.createElement('div');
    navWrap.style.cssText='display:flex;justify-content:center;background:#fff';
    const navClone=navSrc.cloneNode(true);
    navClone.style.position='relative';
    navClone.style.left='0';
    navClone.style.top='0';
    navClone.style.zIndex='auto';
    navClone.querySelectorAll('.selected,.element-overlay,.module-handle,.element-handle,.guide,.overlay-guide,.size-tag,.placeholder').forEach(node=>{
      node.classList.remove('selected');
      if(node.classList.contains('element-overlay')||node.classList.contains('module-handle')||node.classList.contains('element-handle')||node.classList.contains('guide')||node.classList.contains('overlay-guide')||node.classList.contains('size-tag')||node.classList.contains('placeholder'))node.remove()
    });
    navWrap.appendChild(navClone);
    body.appendChild(navWrap)
  }

  shell.appendChild(body);
  document.body.appendChild(shell);
  return shell
}
async function captureScreen(){
  if(!shot)return;
  const prev=shot.textContent;
  shot.disabled=true;
  shot.textContent='截图中';
  document.body.classList.add('shot-mode');
  let exportNode=null;
  try{
    const html2canvas=await loadHtml2Canvas();
    exportNode=buildExportScreen();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const canvas=await html2canvas(exportNode,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false});
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace('T','-').slice(0,15);
    downloadDataUrl(canvas.toDataURL('image/png'),`mini-program-screen-${stamp}.png`)
  }catch(err){
    console.error(err);
    alert('截图失败，请稍后重试')
  }finally{
    exportNode?.remove();
    document.body.classList.remove('shot-mode');
    shot.disabled=false;
    shot.textContent=prev
  }
}
function renderPhoneOffset(){phoneEl.style.left=`${phoneOffset.x}px`;phoneEl.style.top=`${phoneOffset.y}px`}
function startStatusHold(e){if(e.button!==0)return;clearTimeout(statusHoldTimer);statusHoldTimer=setTimeout(()=>{statusDrag={sx:e.clientX,sy:e.clientY,startX:phoneOffset.x,startY:phoneOffset.y};statusBar.classList.add('grabbing')},220)}
function moveStatusHold(e){if(!statusDrag)return;const dx=e.clientX-statusDrag.sx,dy=e.clientY-statusDrag.sy;phoneOffset.x=Math.round(statusDrag.startX+dx);phoneOffset.y=Math.round(statusDrag.startY+dy);renderPhoneOffset()}
function endStatusHold(){clearTimeout(statusHoldTimer);statusHoldTimer=null;if(statusDrag){statusDrag=null;statusBar.classList.remove('grabbing')}}
function moduleHeight(m){if(!hasItems(m))return m.height;const rows=Math.ceil(m.items.length/m.st.col);return rows*m.st.itemH+Math.max(0,rows-1)*m.st.gap}
function textStyle(m,el){const size=el.fs??(el.sub?m.st.ss:m.st.ts),align=m.st.al,vertical=m.st.dir==='vertical'&&!el.sub;return[`font-size:${size}px`,`text-align:${align}`,vertical?'writing-mode:vertical-lr;text-orientation:mixed':''].filter(Boolean).join(';')}
function measurePill(text){return Math.max(48,text.length*9+22)}
function safeText(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function resetElementLayouts(m){const keep={};Object.entries(m.fx||{}).forEach(([eid,val])=>{if(!val)return;const next={};if(typeof val.fs==='number')next.fs=val.fs;if(val.deleted)next.deleted=true;if(Object.keys(next).length)keep[eid]=next});m.fx=keep;if(selectedElement?.mid===m.id)selectedElement=null}
function mk(type){const spec=SPEC[type],base={id:uid(),type,width:spec.width,height:spec.height||spec.itemH,x:0,y:0,afterGap:12,st:{ts:type==='hero'?17:16,ss:12,al:'left',dir:'horizontal',col:spec.layouts[0]||1,gap:10,itemH:spec.itemH||80},fx:{},extraTexts:[]};if(type==='hero')return{...base,title:'春茶古味 / 当前门店',tags:['营业中','距您 1.2km','预计 28 分钟']};if(type==='login')return{...base,title:'欢迎登录小程序',sub:'登录可领取优惠券、查看订单、同步会员权益',btn:'立即登录'};if(type==='promo')return{...base,title:'春季品质甄选',sub:'适合放今日推荐'};if(type==='entry')return{...base,st:{...base.st,col:2,itemH:116,gap:10},items:[{title:'门店自取',sub:'提前下单，到店直接拿'},{title:'外卖点单',sub:'浏览菜单，下单配送到家'}]};if(type==='quick')return{...base,st:{...base.st,col:3,itemH:82,gap:10},items:[{title:'优惠券'},{title:'我的订单'},{title:'会员中心'}]};if(type==='dish')return{...base,st:{...base.st,col:2,itemH:140,gap:10},items:[{title:'招牌双人套餐',sub:'爆款 / 高转化'},{title:'午市轻食套餐',sub:'工作日高频'}]};return{...base,afterGap:0,st:{...base.st,col:4,itemH:62,gap:0},items:[{title:'首页'},{title:'点餐'},{title:'订单'},{title:'我的'}]}}
function resetState(){modules=[mk('hero'),mk('login'),mk('entry'),mk('quick'),mk('promo'),mk('dish'),mk('nav')];selectedId=modules[0].id;selectedElement=null;focusText=null;layoutFlow();renderAll();historyStack=[captureState()];updateUndoButton()}
function layoutFlow(){
  let y=0;
  flowModules().forEach(m=>{
    m.y=y;
    y+=moduleHeight(m)+(m.afterGap??12)
  });
  const navH=navModule()?.st?.itemH||62;
  const viewportH=viewportEl?.clientHeight||0;
  const contentH=Math.max(0,y);
  const minVisible=Math.max(0,viewportH-navH-10);
  cv.style.minHeight=`${Math.max(contentH,minVisible)}px`
}
function mergeElement(m,el){const fx=m.fx?.[el.eid]||{};return{...el,x:fx.x??el.x,y:fx.y??el.y,w:fx.w??el.w,h:fx.h??el.h,fs:fx.fs??el.fs,deleted:!!fx.deleted}}
function handlePos(rect,pos){const cx=rect.x+rect.w/2-5,cy=rect.y+rect.h/2-5;const map={n:[cx,rect.y-5],s:[cx,rect.y+rect.h-5],e:[rect.x+rect.w-5,cy],w:[rect.x-5,cy],ne:[rect.x+rect.w-5,rect.y-5],nw:[rect.x-5,rect.y-5],se:[rect.x+rect.w-5,rect.y+rect.h-5],sw:[rect.x-5,rect.y+rect.h-5]};const [left,top]=map[pos];return`left:${left}px;top:${top}px`}

function startElementMove(e,m,eid){const rect=currentElementRect(m,eid);if(!rect)return;drag={scope:'element',mode:'move',mid:m.id,eid,sx:e.clientX,sy:e.clientY,start:rect,guides:[]}}
function startElementResize(e,m,eid,dir){const rect=currentElementRect(m,eid);if(!rect)return;drag={scope:'element',mode:'resize',mid:m.id,eid,dir,sx:e.clientX,sy:e.clientY,start:rect,guides:[]}}
function moveModule(e){const m=current();if(!m||!drag)return;const rect=cv.getBoundingClientRect();drag.top=snap(Math.max(0,e.clientY-rect.top-drag.offsetY));const center=drag.top+moduleHeight(m)/2,rest=flowModules().filter(item=>item.id!==m.id);let nextIndex=rest.findIndex(item=>center<item.y+moduleHeight(item)/2);if(nextIndex<0)nextIndex=rest.length;if(nextIndex===0)drag.placeholderY=0;else if(nextIndex>=rest.length){const last=rest.at(-1);drag.placeholderY=last?last.y+moduleHeight(last)+6:0}else drag.placeholderY=rest[nextIndex].y-6;const flow=flowModules(),currentIndex=flow.findIndex(item=>item.id===m.id);if(currentIndex!==-1&&currentIndex!==nextIndex){const moving=flow.splice(currentIndex,1)[0];flow.splice(nextIndex,0,moving);const nav=navModule();modules=nav?[...flow,nav]:flow;layoutFlow()}renderCanvas()}
function resizeModule(e){const m=current();if(!m||!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;let width=drag.startWidth,height=drag.startHeight;if(drag.dir.includes('e'))width=drag.startWidth+dx;if(drag.dir.includes('w'))width=drag.startWidth-dx;if(drag.dir.includes('s'))height=drag.startHeight+dy;if(drag.dir.includes('n'))height=drag.startHeight-dy;m.width=clamp(snap(width),180,SPEC[m.type].width);if(hasItems(m)){const rows=Math.max(1,Math.ceil(m.items.length/m.st.col));m.st.itemH=clamp(snap((height-Math.max(0,rows-1)*m.st.gap)/rows),56,400)}else m.height=clamp(snap(height),64,400);resetElementLayouts(m);renderAll()}
function moveElement(e){const m=current();if(!m||!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy,rect={...drag.start,x:drag.start.x+dx,y:drag.start.y+dy},free=e.shiftKey;if(free){const raw={...rect,x:clamp(rect.x,0,m.width-rect.w),y:clamp(rect.y,0,moduleHeight(m)-rect.h)};drag.guides=[];saveElementRect(m,drag.eid,raw,{free:true})}else{const snapped=snapRect(m,drag.eid,rect);drag.guides=snapped.guides;saveElementRect(m,drag.eid,snapped.rect)}renderCanvas();renderDock()}
function resizeElement(e){const m=current();if(!m||!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;let{x,y,w,h}=drag.start;if(drag.dir.includes('e'))w=drag.start.w+dx;if(drag.dir.includes('s'))h=drag.start.h+dy;if(drag.dir.includes('w')){x=drag.start.x+dx;w=drag.start.w-dx}if(drag.dir.includes('n')){y=drag.start.y+dy;h=drag.start.h-dy}w=clamp(snap(w),18,m.width);h=clamp(snap(h),14,moduleHeight(m));x=clamp(snap(x),0,m.width-w);y=clamp(snap(y),0,moduleHeight(m)-h);const snapped=snapRect(m,drag.eid,{x,y,w,h});drag.guides=snapped.guides;saveElementRect(m,drag.eid,snapped.rect);renderCanvas();renderDock()}
function findModuleFromTarget(target){const el=target.closest('.module');if(!el)return null;return modules.find(m=>m.id===el.dataset.id)||null}
function onPointerDown(e){if(e.target.closest('[contenteditable="true"]'))return;const mod=findModuleFromTarget(e.target)||(e.target.closest('#dock .module')?navModule():null);if(!mod)return;const elHandle=e.target.closest('[data-el-resize]');if(elHandle){e.stopPropagation();lastTextTap=null;if(!selectedElement||selectedElement.mid!==mod.id||selectedElement.eid!==elHandle.dataset.eid){selectedId=mod.id;selectedElement={mid:mod.id,eid:elHandle.dataset.eid};focusText=null;renderPanel();renderAuxPanel()}startElementResize(e,mod,elHandle.dataset.eid,elHandle.dataset.elResize);return}const modHandle=e.target.closest('[data-module-resize]');if(modHandle){e.stopPropagation();lastTextTap=null;if(selectedId!==mod.id||selectedElement){selectedId=mod.id;selectedElement=null;focusText=null;renderPanel();renderAuxPanel()}startModuleResize(e,mod,modHandle.dataset.moduleResize);return}const editable=e.target.closest('.editable');if(editable){e.stopPropagation();if(editable.dataset.selectable==='false'){lastTextTap=null;selectModule(mod.id);startModuleMove(e,mod);return}const sameTextTap=editable.dataset.kind==='text'&&lastTextTap&&lastTextTap.mid===mod.id&&lastTextTap.eid===editable.dataset.eid&&Date.now()-lastTextTap.ts<320;selectElement(mod.id,editable.dataset.eid,editable.dataset.path||null);if(sameTextTap){lastTextTap=null;requestAnimationFrame(()=>{const live=document.querySelector(`.editable[data-mid="${mod.id}"][data-eid="${editable.dataset.eid}"]`);if(live)activateInlineEdit(live)});return}if(editable.dataset.kind==='text'){lastTextTap={mid:mod.id,eid:editable.dataset.eid,ts:Date.now()};if(e.detail>=2)return}else lastTextTap=null;startElementMove(e,mod,editable.dataset.eid);return}lastTextTap=null;selectModule(mod.id);startModuleMove(e,mod)}
function onPointerMove(e){if(!drag)return;if(drag.scope==='module'){if(drag.mode==='move')moveModule(e);else resizeModule(e)}else{if(drag.mode==='move')moveElement(e);else resizeElement(e)}}
function onPointerUp(){if(!drag)return;const changed=drag.mode==='move'||drag.mode==='resize';drag=null;renderAll();if(changed)commitHistory()}
function onDoubleClick(e){const text=resolveTextTarget(e.target);if(!text)return;e.preventDefault();e.stopPropagation();activateInlineEdit(text)}
document.querySelectorAll('[data-add]').forEach(btn=>btn.addEventListener('click',()=>addModule(btn.dataset.add)));
document.getElementById('undo')?.addEventListener('click',undoHistory);
dup.addEventListener('click',duplicateSelected);
del.addEventListener('click',deleteSelected);
reset.addEventListener('click',()=>{const prev=captureState();resetState();historyStack=[prev,captureState()];updateUndoButton()});
cv.addEventListener('pointerdown',onPointerDown);
dock.addEventListener('pointerdown',onPointerDown);
cv.addEventListener('dblclick',onDoubleClick);
dock.addEventListener('dblclick',onDoubleClick);
window.addEventListener('pointermove',onPointerMove);
window.addEventListener('pointerup',onPointerUp);
statusBar.addEventListener('pointerdown',e=>{startStatusHold(e)});
statusBar.addEventListener('pointermove',e=>{if(statusDrag){e.preventDefault();moveStatusHold(e)}});
statusBar.addEventListener('pointerup',endStatusHold);
statusBar.addEventListener('pointerleave',()=>{if(!statusDrag)endStatusHold()});
statusBar.addEventListener('pointercancel',endStatusHold);
window.addEventListener('pointermove',moveStatusHold);
window.addEventListener('pointerup',endStatusHold);
window.addEventListener('pointercancel',endStatusHold);
shot?.addEventListener('click',captureScreen);
const targetMatch=(e,sel)=>e.target instanceof Element ? e.target.closest(sel) : null;
const onGlobalKeydown=e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!targetMatch(e,'[contenteditable="true"]')){e.preventDefault();undoHistory();return}
  if((e.key==='Delete'||e.key==='Backspace')&&!targetMatch(e,'input,textarea,[contenteditable="true"]')){e.preventDefault();deleteSelected()}
};
window.addEventListener('keydown',onGlobalKeydown);
document.addEventListener('keydown',onGlobalKeydown,true);
resetState();
</script>
